name: ci

on:
  push:
    branches: [main]
  pull_request:

# least privilege: this workflow only reads the repo to build and test it. Without an explicit
# block the job inherits the repository default, which can be write — an unnecessary standing
# grant on a workflow that runs third-party code from the lockfile.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13 # match local dev; bump deliberately, not implicitly
      - run: bun install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: bun run typecheck
      # The browser app is NOT in `typecheck`: tsc cannot parse .svelte, so svelte-check is its
      # compiler. Without this step 4,900 lines — the surface that changes fastest — had no type
      # gate at all, and a latent parsed-vs-declared mismatch in the graph wire shipped unnoticed.
      - run: bun run check:web
      - run: bun test
      # Playwright matches **/*.pw.ts, which `bun test` never runs. e2e/contract.pw.ts asserts every
      # /api response against the schemas the client parses with — the guard written after four
      # shape regressions shipped invisibly. Leaving it out of CI left that guard opt-in by memory.
      - run: bun run --cwd packages/graph-ui playwright install --with-deps chromium
      - run: bun run e2e
      - run: bun audit
      - if: always()
        run: docker compose down -v
