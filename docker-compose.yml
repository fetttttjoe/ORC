services:
  postgres:
    image: postgres:16-alpine
    command: postgres -c max_connections=300 # parallel test workers: measured ~5 connections each
    environment:
      POSTGRES_PASSWORD: orc
      POSTGRES_DB: orc
    ports:
      - "127.0.0.1:5433:5432" # development databases stay off the network
    volumes:
      - orc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  orc-pgdata:
